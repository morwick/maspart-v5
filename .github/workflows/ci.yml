name: CI (backend pytest)

# Cegah regresi diam-diam (mis. modul yang tak sengaja hilang) sebelum deploy.
on:
  push:
    branches: [snapshot-clean, main]
  pull_request:
    branches: [snapshot-clean, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (torch CPU + requirements)
        run: |
          python -m pip install --upgrade pip wheel
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run tests
        # -p no:randomly: urutan stabil (test_determinisme byte-compare flaky di
        # bawah pengacakan). Model vision (DINOv2) lazy → tak terunduh saat test.
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: pytest -p no:randomly -q
